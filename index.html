<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPS track map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.3.0/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="map-shell">
      <header class="map-header">
        <div class="map-toolbar" role="toolbar" aria-label="Map controls">
          <div class="map-tool-item">
            <button type="button" class="map-tool-btn" id="btn-planar" aria-pressed="true" aria-expanded="false">
              (a)
            </button>
            <button type="button" class="map-tool-info-btn" id="btn-info-planar" aria-label="(a) info">
              i
            </button>
          </div>
          <div class="map-tool-item">
            <button type="button" class="map-tool-btn" id="btn-vertical" aria-expanded="false">
              (b)
            </button>
            <button type="button" class="map-tool-info-btn" id="btn-info-vertical" aria-label="(b) info">
              i
            </button>
          </div>
          <div class="map-tool-item">
            <button type="button" class="map-tool-btn" id="btn-three-dimensional" aria-pressed="false">
              (c)
            </button>
            <button type="button" class="map-tool-info-btn" id="btn-info-three-dimensional" aria-label="(c) info">
              i
            </button>
          </div>
          <div class="map-tool-item">
            <button type="button" class="map-tool-btn" id="btn-volumetric" aria-pressed="false">
              (d)
            </button>
            <button type="button" class="map-tool-info-btn" id="btn-info-volumetric" aria-label="(d) info">
              i
            </button>
          </div>
        </div>
        <div id="planar-panel" class="planar-panel" hidden>
          <p class="planar-panel-coords" id="planar-coords">
            x (longitude): --<br />
            y (latitude): --
          </p>
          <div class="planar-chart-wrap">
            <canvas id="planar-xy-chart" aria-label="Planar X Y chart"></canvas>
          </div>
        </div>
        <div id="three-dimensional-panel" class="three-dimensional-panel" hidden>
          <p class="three-dimensional-panel-coords">
            x (longitude)<br />
            y (latitude)<br />
            z (height / elevation)<br />
            t (time)
          </p>
          <div class="three-dimensional-chart-wrap">
            <canvas id="three-dimensional-cube-chart" aria-label="Three dimensional XYZ cube chart"></canvas>
          </div>
        </div>
        <div id="volumetric-panel" class="volumetric-panel" hidden>
          <p class="volumetric-panel-coords">
            x (longitude)<br />
            y (latitude)<br />
            z (height / elevation)<br />
            t (time)<br />
            v (value)<br />
            a (access)<br />
            o (owenrship)<br />
            g (governance)<br />
            e (experience)
          </p>
          <div class="volumetric-chart-wrap">
            <canvas id="volumetric-cube-chart" aria-label="Volumetric dense cube chart"></canvas>
          </div>
        </div>
      </header>
      <div
        id="map"
        class="map-fullscreen"
        role="application"
        aria-label="GPS track map"
      ></div>
    </div>

    <div id="profile-panel" class="profile-panel" hidden>
      <div class="profile-panel-header">
        <span class="profile-panel-title">Vertical</span>
        <button type="button" class="profile-panel-close" id="profile-close" aria-label="Close Vertical panel">
          ×
        </button>
      </div>
      <p class="profile-panel-stats" id="profile-stats"></p>
      <div class="profile-canvas-wrap">
        <canvas id="profile-canvas" aria-label="Vertical profile along track distance"></canvas>
      </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@5.3.0/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/proj4@2.11.0/dist/proj4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
